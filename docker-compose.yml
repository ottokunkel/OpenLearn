services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # Scale horizontally: docker compose up --scale worker=3

volumes:
  redis-data:
