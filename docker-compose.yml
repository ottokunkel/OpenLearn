services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - redis

  worker:
    build: .
    env_file: .env
    restart: unless-stopped
    # When using Redis mode, start with: docker compose --profile redis up
    # When using Supabase/pgmq mode, start with: docker compose up worker
    # Scale horizontally: docker compose up --scale worker=3

volumes:
  redis-data:
